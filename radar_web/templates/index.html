<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RADAR 腹部 CT 推理</title>
<link rel="icon" href="data:,">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
         background: #f0f2f5; color: #333; padding: 24px; }
  .container { max-width: 1400px; margin: 0 auto; }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .sub { color: #888; font-size: 13px; margin-bottom: 20px; }
  .card { background: #fff; border-radius: 10px; padding: 20px;
          box-shadow: 0 1px 4px rgba(0,0,0,.08); margin-bottom: 16px; }

  /* 拖拽区 */
  #dropzone { border: 2px dashed #b8c4d0; border-radius: 10px; padding: 40px;
              text-align: center; color: #888; cursor: pointer; transition: .2s; }
  #dropzone.dragover { border-color: #1677ff; background: #e6f4ff; color: #1677ff; }
  #dropzone .icon { font-size: 40px; display: block; margin-bottom: 8px; }
  #filelist { margin-top: 12px; font-size: 13px; color: #555; text-align: left; }
  #filelist div { padding: 3px 0; }

  button { background: #1677ff; color: #fff; border: none; border-radius: 6px;
           padding: 10px 32px; font-size: 15px; cursor: pointer; margin-top: 14px; }
  button:disabled { background: #a8c1e8; cursor: not-allowed; }
  button#resetBtn { background: #999; margin-left: 10px; display: none; }

  /* 日志区 */
  #logbox { background: #1e1e1e; color: #d4d4d4; font-family: Menlo, Consolas, monospace;
            font-size: 12px; border-radius: 8px; padding: 14px; height: 240px;
            overflow-y: auto; white-space: pre-wrap; word-break: break-all; display: none; }

  /* 结果区：每个文件一个可折叠块 */
  #resultwrap details { border: 1px solid #e5e5e5; border-radius: 8px; margin-bottom: 10px;
                        background: #fff; }
  #resultwrap summary { cursor: pointer; padding: 10px 14px; font-weight: 600; font-size: 14px;
                        display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
                        list-style: none; user-select: none; }
  #resultwrap summary::-webkit-details-marker { display: none; }
  #resultwrap summary::before { content: '▸'; color: #888; transition: .15s; }
  #resultwrap details[open] summary::before { transform: rotate(90deg); }
  #resultwrap summary .topline { font-weight: normal; font-size: 12px; color: #888;
                                 overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #resultwrap .body { padding: 4px 14px 12px; }
  /* 检查项：两列网格 */
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px 18px; }
  .gitem { display: flex; justify-content: space-between; align-items: center;
            padding: 3px 6px; border-radius: 4px; font-size: 12.5px; }
  .gitem .glabel { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .gitem .gval { font-family: monospace; margin-left: 8px; flex-shrink: 0; }
  .gitem.dim { opacity: .38; }
  .gitem.hidden-row, tr.hidden-row { display: none; }
  .gitem.r-high { background: #fff1f0; }
  .gitem.r-mid { background: #fffbe6; }
  .badge-high { background: #ff4d4f; color: #fff; border-radius: 4px; padding: 0 5px; font-size: 11px; }
  .badge-mid { background: #faad14; color: #fff; border-radius: 4px; padding: 0 5px; font-size: 11px; }
  #resultwrap { overflow-x: auto; }
  .toolbar { margin-bottom: 10px; font-size: 13px; display: flex; gap: 16px; align-items: center; }
  #probFilter { padding: 3px; }
  #downloadBtn { margin-top: 0; padding: 5px 14px; font-size: 13px; }

  .status { padding: 4px 12px; border-radius: 12px; font-size: 12px; }
  .status.running { background: #e6f4ff; color: #1677ff; }
  .status.error { background: #fff1f0; color: #cf1322; }

  /* 影像预览弹窗（niivue 前端渲染）*/
  #viewerModal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5);
                 z-index: 100; justify-content: center; align-items: center; }
  #viewerModal .panel { background: #fff; border-radius: 10px; padding: 20px;
                        max-width: 960px; width: 92vw; max-height: 92vh; overflow: auto; }
  #viewerModal h3 { margin-bottom: 8px; }
  #viewerModal .hint { font-size: 12px; color: #888; margin-bottom: 10px; }
  #nvCanvas { width: 100%; height: 520px; background: #000; border-radius: 6px; }
  #viewerModal .close { margin-top: 12px; }
  .viewBtn { color: #1677ff; cursor: pointer; font-size: 13px; margin-left: 8px; }
  .fitem { margin: 6px 0; font-size: 14px; }
  .fitem .fname { display: inline-block; min-width: 240px; }
  .prog { display: inline-block; width: 200px; height: 10px; background: #eee;
          border-radius: 5px; vertical-align: middle; margin: 0 10px; overflow: hidden; }
  .prog .bar { display: block; height: 100%; width: 0; background: #1677ff;
               border-radius: 5px; transition: width .15s; }
  .prog .bar.ok { background: #52c41a; }
  .prog .bar.err { background: #cf1322; }
  .progtext { font-size: 12px; color: #666; }
</style>
</head>
<body>
<div class="container">
  <h1>RADAR 腹部 CT 通用诊断</h1>
  <div class="sub">上传腹部增强 CT（nii.gz）→ 推理 → 展示 168 项器官-疾病概率</div>

  <div class="card">
    <div id="dropzone">
      <span class="icon">📁</span>
      拖拽 nii.gz 文件到此处，或点击选择文件（支持多选）
    </div>
    <input type="file" id="fileInput" multiple accept=".nii,.nii.gz" hidden>
    <div id="filelist"></div>
    <button id="startBtn" disabled>开始推理</button>
    <button id="resetBtn">重置</button>
    <span id="status" class="status" style="display:none"></span>
  </div>

  <div class="card">
    <div id="logbox"></div>
  </div>

  <div class="card" id="resultcard" style="display:none">
    <div class="toolbar">
      <b>推理结果</b>
      <label>仅显示概率 ≥ <input type="number" id="probFilter" value="0.5" step="0.05" min="0" max="1" style="width:64px"></label>
      <button id="downloadBtn">下载 CSV</button>
    </div>
    <div id="resultwrap"></div>
  </div>
</div>

<div id="viewerModal">
  <div class="panel">
    <h3 id="viewerTitle">影像预览</h3>
    <div class="hint" id="viewerHint">鼠标左键拖动 = 平移/切换层面 · 滚轮 = 缩放 · 右键拖动 = 调节窗宽窗位</div>
    <div id="dlProgress" style="display:none;margin-bottom:8px">
      <div style="font-size:12px;color:#888;margin-bottom:4px" id="dlProgressText">下载中...</div>
      <div style="background:#eee;border-radius:4px;height:8px;overflow:hidden">
        <div id="dlProgressBar" style="background:#1677ff;height:100%;width:0%;transition:width .15s"></div>
      </div>
    </div>
    <canvas id="nvCanvas"></canvas>
    <button class="close" onclick="closeViewer()">关闭</button>
  </div>
</div>

<script>
const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('fileInput');
const filelist = document.getElementById('filelist');
const startBtn = document.getElementById('startBtn');
const resetBtn = document.getElementById('resetBtn');
const logbox = document.getElementById('logbox');
const statusEl = document.getElementById('status');
const resultcard = document.getElementById('resultcard');
const resultwrap = document.getElementById('resultwrap');
const probFilter = document.getElementById('probFilter');
const downloadBtn = document.getElementById('downloadBtn');

let files = [];          // {file: File, uploaded: bool, status: 'uploading'|'ok'|'err'}
let lastCsvText = null;
let ws = null;
let gotResult = false;
let curTaskId = null;

dropzone.onclick = () => fileInput.click();
dropzone.ondragover = e => { e.preventDefault(); dropzone.classList.add('dragover'); };
dropzone.ondragleave = () => dropzone.classList.remove('dragover');
dropzone.ondrop = e => {
  e.preventDefault(); dropzone.classList.remove('dragover');
  addFiles([...e.dataTransfer.files]);
};
fileInput.onchange = () => addFiles([...fileInput.files]);

function addFiles(fs) {
  fs = fs.filter(f => f.name.endsWith('.nii.gz') || f.name.endsWith('.nii'));
  if (!fs.length) return;
  if (!curTaskId) curTaskId = 'task_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
  fs.forEach(f => files.push({ file: f, uploaded: false, status: 'uploading' }));
  renderFiles();
  fs.forEach(f => uploadOne(files.findIndex(it => it.file === f)));  // 拖入即上传
  updateStartBtn();
}

const CHUNK = 8 * 1024 * 1024;  // 8MB 分块，避免代理对大 POST 的超时限制

function fmtSpeed(bytesPerSec) {
  if (bytesPerSec >= 1024*1024) return (bytesPerSec/1024/1024).toFixed(1) + ' MB/s';
  if (bytesPerSec >= 1024) return (bytesPerSec/1024).toFixed(0) + ' KB/s';
  return bytesPerSec.toFixed(0) + ' B/s';
}

// 平滑动画：从当前百分比渐变到目标，期间实时显示网速
function animateProgress(idx, targetPct, bytesPerSec) {
  const row = filelist.children[idx];
  if (!row) return;
  const bar = row.querySelector('.bar');
  const pt = row.querySelector('.progtext');
  const item = files[idx];
  const state = item._prog || (item._prog = { raf: null, cur: 0 });
  state.speed = bytesPerSec;
  if (state.raf) cancelAnimationFrame(state.raf);
  const step = () => {
    state.cur += (targetPct - state.cur) * 0.2;
    if (Math.abs(targetPct - state.cur) < 0.3) state.cur = targetPct;
    bar.style.width = state.cur + '%';
    pt.textContent = Math.round(state.cur) + '% · ' + fmtSpeed(state.speed || 0);
    if (state.cur < targetPct) state.raf = requestAnimationFrame(step);
    else state.raf = null;
  };
  state.raf = requestAnimationFrame(step);
}

function setProgress(idx, pct, text) {
  const item = files[idx];
  if (item && item._prog && item._prog.raf) { cancelAnimationFrame(item._prog.raf); item._prog.raf = null; }
  const row = filelist.children[idx];
  if (!row) return;
  row.querySelector('.bar').style.width = pct + '%';
  const pt = row.querySelector('.progtext');
  if (text !== undefined) pt.textContent = text;
  else if (pct === 100) pt.textContent = '✓ 已上传';
  else pt.textContent = pct + '%';
}

async function uploadOne(idx) {
  const item = files[idx];
  const f = item.file;
  const url = `/api/upload/${curTaskId}/${encodeURIComponent(f.name)}`;
  let offset = 0;
  try {
    while (offset < f.size) {
      const chunk = f.slice(offset, Math.min(offset + CHUNK, f.size));
      let ok = false, lastErr = null;
      const t0 = performance.now();
      for (let tryN = 0; tryN < 3 && !ok; tryN++) {   // 每块最多重试 3 次
        try {
          const r = await fetch(`${url}?offset=${offset}`, { method: 'POST', body: chunk });
          const d = await r.json();
          if (d.ok && d.size === offset + chunk.size) ok = true;
          else lastErr = '服务端校验不符';
          if (!ok && tryN < 2) await new Promise(res => setTimeout(res, 1500));
        } catch (e) { lastErr = e; if (tryN < 2) await new Promise(res => setTimeout(res, 1500)); }
      }
      if (!ok) throw lastErr || '分块上传失败';
      offset += chunk.size;
      // 该块实耗时 → 平均网速，进度条平滑滚动到新位置
      const secs = (performance.now() - t0) / 1000;
      animateProgress(idx, Math.round(offset / f.size * 100), chunk.size / secs);
    }
    item.status = 'ok';
  } catch (e) {
    item.status = 'err';
    console.error(f.name, e);
  }
  if (item.status === 'ok') setProgress(idx, 100);
  else setProgress(idx, 0, '✗ 上传失败');
  updateSegBtn(idx);   // 只更新该行分割按钮，不重渲染整个列表（避免打断其他文件的进度条动画）
  updateStartBtn();
}

// 上传结束后把该行的「分割(上传中...)」灰字换成可点按钮（或失败提示）
function updateSegBtn(idx) {
  const row = filelist.children[idx];
  if (!row) return;
  const old = row.querySelector('[data-seg]');
  if (!old) return;
  const it = files[idx];
  const span = document.createElement('span');
  span.setAttribute('data-seg', '');
  if (it.status === 'ok') {
    const a = document.createElement('a');
    a.href = '#';
    a.textContent = '分割';
    a.style.cssText = 'color:#1677ff;margin-left:8px';
    a.onclick = e => { e.preventDefault(); runSegment(idx, a); };
    span.appendChild(a);
  } else {
    span.style.cssText = 'color:#bbb;margin-left:8px';
    span.textContent = it.status === 'err' ? '分割(上传失败)' : '分割(上传中...)';
  }
  old.replaceWith(span);
}

function updateStartBtn() {
  startBtn.disabled = !(files.length && files.every(it => it.status === 'ok'));
}

function renderFiles() {
  filelist.innerHTML = files.map((it, i) => {
    const f = it.file;
    const barCls = it.status === 'ok' ? 'bar ok' : it.status === 'err' ? 'bar err' : 'bar';
    const statusText = it.status === 'ok' ? '✓ 已上传' :
                       it.status === 'err' ? '✗ 上传失败' : '';
    return `<div class="fitem"><span class="fname">${f.name} (${(f.size/1024/1024).toFixed(1)} MB)</span>` +
      `<span class="prog"><span class="${barCls}" style="width:${it.status==='ok'?100:0}%"></span></span>` +
      `<span class="progtext">${statusText}</span>` +
      `<a href="#" onclick="previewLocal(${i});return false" style="color:#1677ff;margin-left:10px">预览</a>` +
      (it.status === 'ok'
        ? `<a href="#" onclick="runSegment(${i}, this);return false" style="color:#1677ff;margin-left:8px">分割</a>`
        : `<span data-seg style="color:#bbb;margin-left:8px">${it.status === 'err' ? '分割(上传失败)' : '分割(上传中...)'}</span>`) +
      `<a href="#" onclick="removeFile(${i});return false" style="color:#1677ff;margin-left:8px">删除</a></div>`;
  }).join('');
}

window.removeFile = i => { files.splice(i, 1); renderFiles(); updateStartBtn(); };

// ---- 影像预览（niivue 前端渲染）----
const viewerModal = document.getElementById('viewerModal');
let nvInstance = null;

async function showVolume(url, title) {
  // 先清掉上一次的渲染，避免加载期间还显示旧影像
  if (nvInstance) { try { nvInstance.destroy(); } catch(e) {} nvInstance = null; }
  document.getElementById('nvCanvas').getContext('2d')?.clearRect(0, 0, 1e4, 1e4);
  document.getElementById('viewerTitle').textContent = title + '（加载中...）';
  document.getElementById('viewerHint').textContent = '鼠标左键拖动 = 平移/切换层面 · 滚轮 = 缩放 · 右键拖动 = 调节窗宽窗位';
  viewerModal.style.display = 'flex';
  try {
    const { NiiVue } = await import('/static/niivue.js');
    nvInstance = new NiiVue({ isRadiological: false });
    await nvInstance.attachTo('nvCanvas');  // 此版本要求传 id 字符串，不是 canvas 元素
    await nvInstance.addVolume({ url, name: title });
    document.getElementById('viewerTitle').textContent = title;
  } catch (e) {
    document.getElementById('viewerTitle').textContent = '预览失败: ' + e;
    console.error(e);
  }
}

// 上传前：直接读本地文件（Blob URL），不经服务器
window.previewLocal = async i => {
  const it = files[i];
  if (!it) return;
  await showVolume(URL.createObjectURL(it.file), it.file.name);
};

// 推理后：从服务器取回原始文件渲染
window.openViewer = async filename => {
  await showVolume(`/api/file/${curTaskId}/${encodeURIComponent(filename)}`, filename);
};

// ---- 器官分割：点击触发分割推理，轮询进度，完成后弹窗叠加显示 ----
// 37 类 LUT：0=透明背景，1..36=器官金色角彩色
function organLUT() {
  const lut = new Uint8ClampedArray(37 * 4);
  for (let i = 1; i < 37; i++) {
    const h = (i * 137.508) % 360, s = 0.72, v = 0.95;
    const f = (n) => { const k = (n + h / 60) % 6; return v - v * s * Math.max(Math.min(k, 4 - k, 1), 0); };
    lut[i*4] = Math.round(f(5) * 255); lut[i*4+1] = Math.round(f(3) * 255);
    lut[i*4+2] = Math.round(f(1) * 255); lut[i*4+3] = 255;
  }
  return lut;
}

window.runSegment = async (idx, btn) => {
  const item = files[idx];
  if (!item || item.status !== 'ok') {
    alert('文件尚未上传完成，无法分割');
    return;
  }
  const fname = item.file.name;
  btn.textContent = '分割中 0%';
  // 分割日志显示在日志区（与推理共用任务日志缓冲，用全局 logCount 记录已收条数）
  logbox.style.display = 'block';
  appendLog(`[Web] 开始器官分割: ${fname}`);
  try {
    // 触发分割（服务端缓存过则直接返回 done）
    const r = await fetch(`/api/segment/${curTaskId}/${encodeURIComponent(fname)}`, { method: 'POST', body: new FormData() });
    const d = await r.json();
    if (!d.ok) throw d.msg || '启动分割失败';
    // 轮询进度直到完成（分割约 30-60 秒）
    let st;
    do {
      await new Promise(res => setTimeout(res, 2000));
      const r2 = await fetch(`/api/segment/${curTaskId}/${encodeURIComponent(fname)}?since=${logCount}`);
      st = await r2.json();
      if (st.logs && st.logs.length) {
        logCount += st.logs.length;
        st.logs.forEach(appendLog);
      }
      if (!st.ok) throw st.msg || '分割失败';
      if (st.status === 'running') btn.textContent = '分割中 ' + (st.progress ?? 0) + '%';
    } while (st.status !== 'done');
    btn.textContent = '查看分割';
    showSegViewer(fname);
  } catch (e) {
    console.error(e);
    alert('器官分割失败: ' + e);
    appendLog('[错误] 器官分割失败: ' + e);
    btn.textContent = '分割失败，点击重试';
  }
};

function showSegViewer(fname) {
  const ctUrl = `/api/file/${curTaskId}/${encodeURIComponent('seg_ct_' + fname)}`;
  const maskUrl = `/api/file/${curTaskId}/${encodeURIComponent('seg_mask_' + fname)}`;
  if (nvInstance) { try { nvInstance.destroy(); } catch(e) {} nvInstance = null; }
  document.getElementById('nvCanvas').getContext('2d')?.clearRect(0, 0, 1e4, 1e4);
  document.getElementById('viewerTitle').textContent = fname + '（分割加载中...）';
  document.getElementById('viewerHint').textContent = '彩色为 37 类器官分割 · 左键拖动切换层面 · 滚轮缩放 · 右键拖动调窗宽窗位';
  viewerModal.style.display = 'flex';
  (async () => {
    try {
      // 先带进度地下载两个 nii.gz（大文件下载才是耗时大头），再交给 niivue 本地渲染。
      // 注意：此版本 addVolume 不支持 data 参数，但 url 可传 File 对象（内部走 arrayBuffer，无二次网络请求）。
      showDlProgress();
      const [ctBuf, maskBuf] = await Promise.all([fetchWithProgress(ctUrl), fetchWithProgress(maskUrl)]);
      hideDlProgress();
      const { NiiVue } = await import('/static/niivue.js');
      nvInstance = new NiiVue({ isRadiological: false });
      await nvInstance.attachTo('nvCanvas');
      await nvInstance.addVolume({ url: new File([ctBuf], 'seg_ct.nii.gz'), name: 'seg_ct' });
      await nvInstance.addVolume({ url: new File([maskBuf], 'seg_mask.nii.gz'), name: 'seg_mask', colormapLabel: { min: 0, lut: organLUT() } });
      document.getElementById('viewerTitle').textContent = fname + '（器官分割）';
    } catch (e) {
      hideDlProgress();
      document.getElementById('viewerTitle').textContent = '分割显示失败: ' + e;
      console.error(e);
    }
  })();
}

// ---- 带进度的文件下载（流式读取 response body）----
const dlState = { files: 0, done: 0, received: 0, total: 0 };

function showDlProgress() {
  dlState.files = 0; dlState.done = 0; dlState.received = 0; dlState.total = 0;
  document.getElementById('dlProgress').style.display = 'block';
  updateDlProgressUI();
}

function hideDlProgress() {
  document.getElementById('dlProgress').style.display = 'none';
}

function updateDlProgressUI() {
  const pct = dlState.total > 0 ? Math.round(dlState.received / dlState.total * 100) : 0;
  const mb = n => (n / 1024 / 1024).toFixed(1);
  document.getElementById('dlProgressBar').style.width = pct + '%';
  document.getElementById('dlProgressText').textContent =
    `下载分割结果中... ${pct}%（${mb(dlState.received)}${dlState.total > 0 ? ' / ' + mb(dlState.total) : ''} MB，文件 ${dlState.done}/${dlState.files}）`;
}

async function fetchWithProgress(url) {
  const r = await fetch(url);
  if (!r.ok) throw `HTTP ${r.status}`;
  const total = +(r.headers.get('Content-Length') || 0);
  dlState.files++; if (total) dlState.total += total;
  if (!r.body) {                    // 流式读取不可用时直接整包取
    dlState.received += total; dlState.done++; updateDlProgressUI();
    return await r.arrayBuffer();
  }
  const reader = r.body.getReader();
  const chunks = [];
  let received = 0;
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    chunks.push(value);
    received += value.length;
    dlState.received += value.length;
    updateDlProgressUI();
  }
  dlState.done++;
  updateDlProgressUI();
  const buf = new Uint8Array(received);
  let off = 0;
  for (const c of chunks) { buf.set(c, off); off += c.length; }
  return buf;
}

window.closeViewer = () => {
  if (nvInstance) { try { nvInstance.destroy(); } catch(e) {} nvInstance = null; }
  viewerModal.style.display = 'none';
};
viewerModal.onclick = ev => { if (ev.target === viewerModal) closeViewer(); };

function setStatus(text, cls) {
  statusEl.style.display = 'inline';
  statusEl.textContent = text;
  statusEl.className = 'status ' + (cls || '');
}

let logCount = 0;       // 已收到的日志条数，断线重连时作为 since 续传

function connectWS(taskId) {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws/${taskId}?since=${logCount}`);

  ws.onopen = () => {
    if (!gotResult && logCount === 0) appendLog('[Web] WebSocket 已连接，开始推理...');
    else appendLog('[Web] 日志连接已恢复，继续接收...');
    setStatus('推理中...', 'running');
  };

  ws.onmessage = ev => {
    const msg = JSON.parse(ev.data);
    if (msg.type === 'ping') return;                    // 心跳，忽略
    if (msg.type === 'log') {
      appendLog(msg.text);
      logCount++;
    } else if (msg.type === 'result') {
      gotResult = true;
      if (msg.error) {
        setStatus('推理失败: ' + msg.error, 'error');
      } else {
        setStatus('完成', 'running');
        renderResult(msg.result);
      }
      resetBtn.style.display = 'inline';
    }
  };

  ws.onclose = () => {
    if (gotResult) return;
    // 推理单例耗时数分钟，RunPod 代理可能掐空闲连接；任务仍在后台跑，3 秒后重连续传日志
    appendLog('[Web] 连接中断，3 秒后自动重连（推理仍在后台进行）...');
    setStatus('重连中...', 'running');
    setTimeout(() => { if (!gotResult) connectWS(taskId); }, 3000);
  };
  ws.onerror = () => { /* 由 onclose 统一处理重连 */ };
}

startBtn.onclick = () => {
  startBtn.disabled = true;
  gotResult = false;
  logCount = 0;
  logbox.style.display = 'block';
  logbox.textContent = '';
  setStatus('正在连接...', 'running');
  const taskId = curTaskId;

  connectWS(taskId);

  // 触发推理（文件在拖入时已上传）
  fetch(`/api/infer/${taskId}?start=1`, { method: 'POST', body: new FormData() })
    .then(r => r.json())
    .then(d => {
      if (!d.ok) { setStatus(d.msg, 'error'); appendLog('[错误] ' + d.msg); startBtn.disabled = false; }
      else setStatus('推理中...', 'running');
    })
    .catch(e => { setStatus('启动推理失败: ' + e, 'error'); startBtn.disabled = false; });
};

function appendLog(text) {
  // tqdm 风格进度行（Infer:/Seg:）：若日志行已存在则替换最后一行
  if (/^(Infer:|Seg:)/.test(text) && logbox.lastChild && /^(Infer:|Seg:)/.test(logbox.lastChild.textContent)) {
    logbox.lastChild.textContent = text;
  } else {
    const line = document.createElement('div');
    line.textContent = text;
    logbox.appendChild(line);
  }
  logbox.scrollTop = logbox.scrollHeight;
}

function renderResult(records) {
  resultcard.style.display = 'block';
  if (!records || !records.length) {
    resultwrap.innerHTML = '<p>无结果（文件可能被跳过，请检查日志）</p>';
    return;
  }
  const keys = Object.keys(records[0]).filter(k => k !== 'file_name');

  // 汇总 CSV 文本用于下载
  const header = ['file_name', ...keys].join(',');
  const rows = records.map(r => [r.file_name, ...keys.map(k => r[k] ?? '')].join(','));
  lastCsvText = [header, ...rows].join('\n');

  const html = [];
  // 找出全局最高分，默认只展开该病例
  let maxFile = records[0], maxScore = -1;
  for (const r of records) {
    const top = keys.map(k => parseFloat(r[k])).filter(v => !isNaN(v)).sort((a,b)=>b-a)[0] || -1;
    if (top > maxScore) { maxScore = top; maxFile = r; }
  }
  for (const r of records) {
    const items = keys
      .map(k => ({ k, v: parseFloat(r[k]) }))
      .filter(x => !isNaN(x.v))
      .sort((a, b) => b.v - a.v);
    const top = items[0];
    const safeName = r.file_name.replace(/'/g, "\\'");
    html.push(`<details${r === maxFile ? ' open' : ''}>` +
      `<summary>${r.file_name}` +
      `<span class="topline">最高: ${top.k} ${top.v.toFixed(2)}</span>` +
      `<span class="viewBtn" onclick="event.stopPropagation();openViewer('${safeName}')">查看影像</span></summary>` +
      `<div class="body"><div class="grid">`);
    const th = parseFloat(probFilter.value);
    for (const it of items) {
      const badge = it.v >= 0.5 ? ' <span class="badge-high">高</span>' : (it.v >= 0.3 ? ' <span class="badge-mid">中</span>' : '');
      const rowCls = (it.v >= 0.5 ? 'r-high' : it.v >= 0.3 ? 'r-mid' : '') + (it.v < th ? ' hidden-row' : '');
      html.push(`<div class="gitem ${rowCls}" data-prob="${it.v}">` +
        `<span class="glabel">${it.k}${badge}</span>` +
        `<span class="gval">${it.v.toFixed(3)}</span></div>`);
    }
    html.push('</div></div></details>');
  }
  resultwrap.innerHTML = html.join('');

  // 下载 CSV
  downloadBtn.onclick = () => {
    if (!lastCsvText) return;
    const blob = new Blob(['\ufeff' + lastCsvText], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'radar_results.csv';
    a.click();
  };
}

probFilter.onchange = () => {
  const th = parseFloat(probFilter.value);
  resultwrap.querySelectorAll('.gitem').forEach(el => {
    el.classList.toggle('hidden-row', parseFloat(el.dataset.prob) < th);
  });
};

resetBtn.onclick = () => {
  files = []; renderFiles();
  logbox.textContent = ''; logbox.style.display = 'none';
  resultcard.style.display = 'none'; lastCsvText = null;
  statusEl.style.display = 'none';
  resetBtn.style.display = 'none';
  if (ws) { ws.close(); ws = null; }
};
</script>
</body>
</html>
